[project]
name = "candleisgreen"
version = "0.1.0"
description = "Evidence-driven quantitative research workstation. Paper trading only."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "numpy>=2.0",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "cvxpy>=1.5",
  "clarabel>=0.9",
  "duckdb>=1.0",
  "pyarrow>=16",
  "defusedxml>=0.7",
  "fastapi>=0.160",
  "uvicorn>=0.30",
  "apscheduler>=3.11,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["candleisgreen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
