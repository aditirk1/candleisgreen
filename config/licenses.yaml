# License registry. Every observation carries a license ID, and every forecast carries the
# IDs of the data it used. A use not marked `permitted` is refused, including `unverified`
# (QUESTIONS Q3: never assume trading use is authorized without checking the license).
registry_version: "1.0.0"
licenses:
  synthetic:
    description: Invented test data
    research: permitted
    paper_trading: permitted
  cc_by_4_0:
    description: Creative Commons Attribution 4.0. Open Source Asset Pricing data
    research: permitted
    paper_trading: permitted
    note: Attribution required in any published output
  cc_by_nc_4_0:
    description: Creative Commons Attribution-NonCommercial 4.0. JKP Global Factor Data
    research: permitted
    paper_trading: unverified
    note: Noncommercial academic and personal research only until the trading interpretation is checked
  french_library:
    description: Kenneth French data library. Copyright notice, no license text
    research: permitted
    paper_trading: unverified
    note: Personal research only until terms are confirmed
  user_capture:
    description: Material you pasted into the Research Capture Inbox. Only a hash, a short summary and extracted claims are kept
    research: permitted
    paper_trading: unverified
    note: A captured claim must be tested on licensed data before anything trades on it
  clinicaltrials_gov:
    description: ClinicalTrials.gov registry records from the National Library of Medicine
    research: permitted
    paper_trading: unverified
    note: The terms page did not render for automated reading on 2026-11-24. Read it before any published or trading use. Biotech names are research only
  alpaca_market_data:
    description: Alpaca free market data for the account holder
    research: permitted
    paper_trading: permitted
    note: For the account holder only. Never redistributed or published
  us_government_public:
    description: SEC EDGAR, BLS, BEA public data
    research: permitted
    paper_trading: permitted
  fred_terms:
    description: FRED and ALFRED terms of use
    research: permitted
    paper_trading: unverified
    note: Some series carry third-party copyright. Check per series before trading use
  kraken_public:
    description: Kraken public market data (OHLC, ticker, order book)
    research: unverified
    paper_trading: not_permitted
    note: "Kraken's Global Terms (updated 2026-11-18, read in part on 2026-11-28) appear to limit use to your own benefit and to restrict third-party applications, bots and data extraction without written consent. Read sections 8 and 9 before marking research permitted"
  oanda_practice:
    description: OANDA v20 API data from your own fxTrade Practice account
    research: unverified
    paper_trading: unverified
    note: "The API license text is shown when you create a personal access token. It could not be read on 2026-11-28. Read it when you create the token, then mark research permitted if it allows your use"
  cftc_public_domain:
    description: CFTC Commitments of Traders reports
    research: permitted
    paper_trading: permitted
    note: "CFTC Web Policy: government information at the CFTC website is in the public domain. Acknowledge the CFTC in any published use"
  cme_website:
    description: CME Group website pages (Daily Bulletin, settlements, contract specs)
    research: unverified
    paper_trading: not_permitted
    note: "cmegroup.com did not answer automated requests on 2026-11-28, so its terms of use could not be read. Nothing is fetched from it. Settlement files you download yourself can be uploaded as your own material"
  user_upload:
    description: Data files you uploaded yourself, such as futures settlement prices you downloaded
    research: permitted
    paper_trading: not_permitted
    note: You confirm you may use the file for personal research. Results built on it stay research only
