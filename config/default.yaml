# CandleIsGreen configuration. Spec v3.1 defaults.
# Every threshold and limit lives here. Change a value here, never in code.
# Bump config_version on every edit. The loader rejects unknown keys.
config_version: "3.1.1"
spec_version: "3.1"

time:
  market_timezone: America/New_York
  decision_time_local: "16:30"
  # Orders are sliced inside this regular-session window on the next trading day.
  execution_window_start_local: "09:35"
  execution_window_end_local: "10:30"

universe:
  min_price: 5.0
  min_median_dollar_volume_20d: 10000000
  # Hysteresis. A member leaves only below these exit levels.
  exit_min_price: 4.0
  exit_min_median_dollar_volume_20d: 7500000
  dollar_volume_window_days: 20
  exclude_leveraged_inverse_etfs: true

composite:
  standardize:
    winsor_lower_pct: 1.0
    winsor_upper_pct: 99.0
    ts_std_window_days: 252
    ts_clip: 3.0
    ema_halflife_fraction_of_horizon: 0.5
  research_portfolio:
    vol_target_annual: 0.10
    research_nav_usd: 1000000
    newey_west_max_lag_days: 63
    trading_days_per_year: 252
  edge:
    # McLean and Pontiff (2016): 58% lower after publication, 26% lower out of sample.
    # Less severe estimates: Jensen, Kelly and Pedersen about 0.53, Chen and Zimmermann about 0.88.
    delta_us_published: 0.42
    delta_non_us_published: 0.74
    delta_other_published: 0.74
    omega_factor: 0.5
    cold_start_tau_annual: 0.05
    tau_floor_annual: 0.01
    family_min_signals_for_prior: 5
    delta_replace_min_signals: 20
  eligibility:
    min_tier: 4
    capital_min_tier: 5
    min_prob_positive: 0.80
    min_oos_days: 252
    min_events: 30
    # Tier 4 economic test: block-bootstrap interval of net return at multiplied costs.
    interval_level: 0.90
    cost_multiplier: 2.0
    bootstrap_block_days: 21
    bootstrap_resamples: 2000
    # Tier 3 independent replication: same sign and significant at this two-sided level.
    replication_significance: 0.05
  weights:
    cov_window_days: 756
    cov_min_days: 252
    hrp_min_families: 3
    signal_cap: 0.20
    family_cap: 0.35
    max_monthly_relative_change: 0.25
    max_monthly_absolute_change_floor: 0.02
    new_signal_initial_weight_max: 0.05
    duplicate_correlation_threshold: 0.95
  alpha:
    ic_horizon_days: 21
    ic_shrink_days: 252
    alpha_clip_sigmas: 3.0
    calibration_slope_min: 0.5
    calibration_slope_max: 1.5
    calibration_min_t: 2.0
  optimizer:
    n_factors: 15
    cov_window_days: 252
    impact_kappa: 0.5
    impact_kappa_floor: 0.5
    vol_target_annual: 0.12
    sector_cap: 0.25
    no_trade_band: 0.0025
    lambda_bisection_iterations: 30
    lambda_min: 0.001
    lambda_max: 100000.0
    specific_var_shrink: 0.5
    min_history_days: 126
    alpha_horizon_days: 21

risk:
  # Hard limits. Aditi sets these. Tightening applies now. Loosening waits.
  hard_limits:
    max_position_pct_equity: 0.05
    max_cluster_pct_equity: 0.20
    max_order_pct_adv20: 0.01
    max_spread_pct: 0.005
    daily_loss_stop_pct_equity: 0.02
    max_quote_age_seconds: 15
  loosening_delay_hours: 24

execution:
  mode: auto_simulation
  # Must stay false. The loader refuses any other value.
  live_trading_enabled: false
  simulator_starting_equity_usd: 100000
