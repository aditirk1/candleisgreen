# News categories. Each rule matches words in the headline or summary, first match wins.
# `what_it_is` and `can_affect` are general descriptions for a reader, not measured effects.
# Measured effects come only from recorded prices and are shown separately as "what prices did".
rules_version: "1.0.0"
categories:
  - id: monetary_policy
    label: Interest rates
    match: [FOMC, Federal Open Market Committee, discount rate, federal funds, monetary policy, interest on reserve]
    what_it_is: A decision, minutes or statement about US interest rate policy
    can_affect: Bond yields, bank stocks and the broad market, mostly when the news differs from what was expected
  - id: enforcement
    label: Enforcement
    match: [enforcement action, charges, charged, civil penalty, fraud, settles, settlement, cease and desist, litigation, complaint]
    # Every SEC litigation release is an enforcement action, even when its title is only names.
    feeds: [sec_litigation]
    what_it_is: A regulator acting against a named firm or person
    can_affect: The named firm, if it is listed. Large firms often absorb these with little price change
  - id: deal_approval
    label: Deal approval
    match: [approval of application, approval of two applications, approves application, approval of the applications, merger, acquisition]
    what_it_is: A regulator approving a merger, acquisition or other application
    can_affect: The firms named, mostly when the approval was in doubt
  - id: rulemaking
    label: Rule change
    match: [proposal, proposed rule, comment period, final rule, guidance, rule amendments, interim final]
    what_it_is: A rule being proposed, changed or finalized
    can_affect: The industry it covers, usually later and gradually
  - id: data_release
    label: Data release
    match: [survey, results of, report, statistics, data release, beige book]
    what_it_is: A survey, report or data release
    can_affect: Usually little directly. Some releases shift rate expectations
  - id: leadership
    label: Leadership
    match: [appoint, appointed, names, named, departure, resign, sworn in, nominat]
    what_it_is: A leadership change at a regulator or firm
    can_affect: Policy direction over time, rarely prices on the day
