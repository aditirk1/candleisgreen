  composite.optimizer.sector_cap: {basis: safeguard, change_policy: Aditi approves. Concentration limit. Unknown sectors share one bucket}
  composite.optimizer.no_trade_band: {basis: provisional, review: Skips trades too small to be worth their cost}
  composite.optimizer.lambda_bisection_iterations: {basis: provisional, review: Numerical setting}
