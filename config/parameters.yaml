  composite.weights.cov_min_days: {basis: provisional, review: One trading year}
  composite.weights.hrp_min_families: {basis: provisional, review: HRP needs at least three clusters to be meaningful}
  composite.weights.signal_cap: {basis: safeguard, change_policy: Aditi approves. Concentration limit}
  composite.weights.family_cap: {basis: safeguard, change_policy: Aditi approves. Concentration limit}
  composite.weights.max_monthly_relative_change: {basis: safeguard, change_policy: Aditi approves. Limits weight churn}
  composite.weights.max_monthly_absolute_change_floor: {basis: safeguard, change_policy: Aditi approves. Limits weight churn}
  composite.weights.new_signal_initial_weight_max: {basis: safeguard, change_policy: Aditi approves. Limits a new signal's first weight}
  composite.weights.duplicate_correlation_threshold: {basis: provisional, review: Above this two signals are treated as one}

  composite.alpha.ic_horizon_days: {basis: provisional, review: One trading month}
  composite.alpha.ic_shrink_days: {basis: provisional, review: Shrinks IC by half at one year of evidence}
  composite.alpha.alpha_clip_sigmas: {basis: safeguard, change_policy: Aditi approves. Limits the effect of one extreme score}
  composite.alpha.calibration_slope_min: {basis: provisional, review: Wide band for a noisy slope estimate}
  composite.alpha.calibration_slope_max: {basis: provisional, review: Wide band for a noisy slope estimate}
  composite.alpha.calibration_min_t: {basis: provisional, review: Conventional significance on overlap-corrected IC}

