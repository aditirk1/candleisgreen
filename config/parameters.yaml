# Parameter registry. Every value in config/default.yaml is classified here.
#
# basis:
#   empirical      A value taken from published evidence. Needs `source`. Changes only with
#                  a new cited source or platform evidence in the experiment registry.
#   safeguard      An engineering protection. Its job is to limit damage, not to fit data.
#                  Never chosen by a search, backtest or optimizer. Aditi approves changes.
#   provisional    An initial configuration with no evidence behind the exact number.
#                  Needs `review`: what evidence would change it. Shown as PROVISIONAL
#                  wherever it decides an outcome. Experiments may vary it, and every
#                  variant counts in the trial registry.
#   external_fact  An official or conventional number that is not a threshold (a fee rate,
#                  a time zone). Needs `source` and `as_of`.
#
# Metadata keys (config_version, spec_version, any `description`) are not parameters.
registry_version: "1.0.0"
parameters:
