  composite.eligibility.capital_min_tier: {basis: safeguard, change_policy: Aditi approves. Governance gate}
  composite.eligibility.min_prob_positive: {basis: provisional, review: "Weak alone (REVIEW E2, E3). Tier 3 and Tier 4 do most of the filtering"}
  composite.eligibility.min_oos_days: {basis: provisional, review: One trading year. Not a statistical requirement}
  composite.eligibility.min_events: {basis: provisional, review: Rule of thumb for event studies}
  composite.eligibility.interval_level: {basis: provisional, review: 90% two-sided equals a one-sided 5% test (REVIEW E30)}
  composite.eligibility.cost_multiplier: {basis: safeguard, change_policy: Aditi approves. Margin of safety on modeled costs}
  composite.eligibility.bootstrap_block_days: {basis: provisional, review: Matches the 21-day alpha horizon}
  composite.eligibility.bootstrap_resamples: {basis: provisional, review: Numerical precision only}
  composite.eligibility.replication_significance: {basis: provisional, review: The conventional 5% level}

  composite.promotion.shadow_min_trading_days: {basis: provisional, review: "63 trading days as the minimum (Q8). Strategies add trade-count and precision requirements"}
  composite.promotion.default_min_shadow_trades: {basis: provisional, review: Default when a strategy declares none. Low-turnover strategies need their own value}
