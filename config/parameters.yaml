  universe.exit_min_price: {basis: provisional, review: Hysteresis width. Revisit with measured universe turnover}
  universe.exit_min_median_dollar_volume_20d: {basis: provisional, review: Hysteresis width. Revisit with measured universe turnover}
  universe.dollar_volume_window_days: {basis: provisional, review: Shorter windows react faster and are noisier}
  universe.exclude_leveraged_inverse_etfs: {basis: safeguard, change_policy: Aditi approves}
  universe.research_universes.biotech.min_price: {basis: provisional, review: Research only. Zero means no filter}
  universe.research_universes.biotech.min_median_dollar_volume_20d: {basis: provisional, review: Research only. Zero means no filter}
  universe.research_universes.biotech.sic_codes: {basis: provisional, review: "SIC 2834, 2835, 2836 and 8731 as the biotech definition. Revisit if names are missed"}

