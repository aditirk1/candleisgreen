  composite.costs.finra_taf_per_share_sold: {basis: external_fact, source: "FINRA TAF fee holiday 2026-10-01 to 2026-12-31 (SR-FINRA-2026-021). Scheduled 2027 rate 0.000232 per share", as_of: "2026-10-01"}
  composite.costs.finra_taf_max_per_trade_usd: {basis: external_fact, source: FINRA 2026 TAF schedule, as_of: "2026-10-01"}
  composite.costs.borrow_rate_annual: {basis: provisional, review: Easy-to-borrow assumption. Understates hard-to-borrow names}
  composite.costs.vol_lookback_days: {basis: provisional, review: Ex-ante volatility window for research portfolios}
