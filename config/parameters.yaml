  composite.research_portfolio.newey_west_max_lag_days: {basis: provisional, review: Cap on the HAC lag for long horizons}
  composite.research_portfolio.trading_days_per_year: {basis: external_fact, source: US equity market convention, as_of: "2026-11-17"}

