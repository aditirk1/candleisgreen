  research.criteria.novelty_similarity: {basis: provisional, review: Definition overlap above which a new claim is linked to an existing signal instead of tested as new}

  markets.us_exchanges: {basis: safeguard, change_policy: "Aditi approves. Only these venues can hold direct instruments"}
