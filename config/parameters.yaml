  time.decision_time_local: {basis: provisional, review: Move if data needed at decision time arrives later than 16:30 ET}
  time.execution_window_start_local: {basis: provisional, review: "Compare measured slippage across alternative windows before fixing a permanent default (Q4)"}
  time.execution_window_end_local: {basis: provisional, review: "Compare measured slippage across alternative windows before fixing a permanent default (Q4)"}
  time.preopen_check_local: {basis: provisional, review: "Late enough to see overnight filings and halts, early enough to cancel before the window opens. Revisit once halt timing is measured"}

