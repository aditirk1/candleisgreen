  composite.costs.long_only_quantile: {basis: provisional, review: Top third. Test top quintile and decile as variants}

  composite.edge.delta_us_published: {basis: empirical, source: "McLean and Pontiff (2016), JF 71(1): long-short returns 58% lower after publication, 97 predictors. Less severe estimates: Jensen, Kelly and Pedersen (2023) about 0.53, Chen and Zimmermann (2020) about 0.88"}
  composite.edge.delta_non_us_published: {basis: empirical, source: "McLean and Pontiff (2016) data-mining share of 26%, and Jacobs and Mueller (2020), JFE 135(1): no reliable post-publication decline outside the US"}
  composite.edge.delta_other_published: {basis: provisional, review: Extrapolated from equity results to other families. No direct evidence}
  composite.edge.omega_factor: {basis: provisional, review: Caps paper-only confidence at P of 0.977 (REVIEW E3)}
  composite.edge.cold_start_tau_annual: {basis: provisional, review: Allows a Sharpe of about 0.5 either way at one standard deviation}
  composite.edge.tau_floor_annual: {basis: safeguard, change_policy: Aditi approves. Stops the family prior collapsing to zero variance}
  composite.edge.family_min_signals_for_prior: {basis: provisional, review: Fewer signals give an unstable prior}
  composite.edge.delta_replace_min_signals: {basis: provisional, review: Signals needed before a family's own decay ratio replaces the literature value}
  composite.edge.implementation_gap_factor: {basis: provisional, review: Extra variance for academic portfolio evidence that is not the tradable version (Q14)}

