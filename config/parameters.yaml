  composite.standardize.winsor_upper_pct: {basis: provisional, review: "Common practice, no evidence for the exact percentile"}
  composite.standardize.ts_std_window_days: {basis: provisional, review: One trading year by convention}
  composite.standardize.ts_clip: {basis: safeguard, change_policy: Aditi approves. Limits the effect of one extreme score}
  composite.standardize.ema_halflife_fraction_of_horizon: {basis: provisional, review: Trades turnover against signal decay. Test per family}

