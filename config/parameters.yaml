  composite.promotion.shadow_band_level: {basis: provisional, review: Width of the pre-registered band for realized shadow returns}
  composite.promotion.max_tracking_error_annual: {basis: provisional, review: Allowed gap between the tradable version and its research record}

  composite.monitoring.min_observation_days: {basis: provisional, review: Below this the deterioration test is not run}
