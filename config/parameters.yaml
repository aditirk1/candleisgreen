  composite.optimizer.cov_window_days: {basis: provisional, review: One trading year}
  composite.optimizer.impact_kappa: {basis: provisional, review: "Consistent with an order-unity square-root prefactor (Toth et al. 2011). Calibrate from measured slippage"}
