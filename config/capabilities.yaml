# Capability map. Spec principle 3: a feature without adequate data shows NOT AVAILABLE
# and the reason. Spec principle 11: only free sources, no restricted free tiers as core
# dependencies, no scraping as a primary dependency.
# status: available, limited, not_available. Every status except available needs a reason.
capabilities_version: "1.0.0"
capabilities:
  us_factor_research:
    status: available
    sources: [open_source_asset_pricing_portfolios, kenneth_french_library]
    note: Portfolio returns built from CRSP, including delisted stocks
  global_factor_research:
    status: limited
    sources: [jkp_global_factor_data]
    reason: Factor and portfolio returns only, licensed for non-commercial use
  us_daily_bars:
    status: limited
    sources: [alpaca_historical_sip_delayed]
    reason: History starts in 2016 and delisted coverage is unconfirmed, so tests on it are labeled SURVIVORSHIP-BIASED
  us_stock_history_with_delistings:
    status: limited
    sources: [forward_recorder]
    reason: Survivorship-aware only from the day the forward recorder starts, and complete only where its flags say so
  us_fundamentals_point_in_time:
    status: limited
    sources: [sec_edgar_xbrl]
    reason: XBRL data starts in 2009. Uses the filed date for point-in-time
  macro:
    status: limited
    sources: [fred, alfred]
    reason: FRED and ALFRED vintages need a free FRED API key in FRED_API_KEY. BLS and BEA direct feeds are not built
  clinical_trials:
    status: limited
    sources: [clinicaltrials_gov]
    reason: Recorded forward from the first run, because the API serves only the latest version of each study. Research only
  fda_advisory_calendar:
    status: not_available
    sources: []
    reason: The FDA calendar page fills its table with JavaScript and no documented feed was found on 2026-11-24. Paste a meeting notice into the Research Capture Inbox instead
  paper_execution_us:
    status: available
    sources: [alpaca_paper]
  realtime_consolidated_quotes:
    status: not_available
    reason: The free real-time feed covers the IEX exchange only. Risk checks use IEX quotes
  intraday_trading:
    status: not_available
    reason: No free real-time consolidated data. The platform trades at daily frequency
  short_selling_us:
    status: limited
    sources: [alpaca_paper_trading]
    reason: Easy-to-borrow US stocks only, within your short limits of 3% per stock and 30% in total. Hard-to-borrow names need a locate and are never shorted. Alpaca requires at least 2,000 USD of equity
  options_trading:
    status: not_available
    sources: []
    reason: Paper options orders through Alpaca are not sent yet. They wait for a read-only check with your Alpaca keys, and the free indicative quotes cannot pass the execution-grade quote rule. The options simulator inside the platform works
  crypto_trading:
    status: not_available
    sources: []
    reason: Paper crypto orders through Alpaca are not sent yet. They need your Alpaca keys and a read-only check first. The crypto simulator inside the platform works now, buy and sell only, never short
  futures_trading:
    status: not_available
    sources: []
    reason: Alpaca lists futures as coming soon (checked 2026-11-27). Other brokers need paid futures market data
  fx_rates:
    status: limited
    sources: [fred]
    reason: Daily reference rates from the FRED H.10 series, research only. No intraday quotes
  fx_trading:
    status: not_available
    sources: []
    reason: Alpaca offers no currency trading. OANDA practice orders are not built. The forex simulator works once an OANDA practice token is set and its license is confirmed
  futures_data:
    status: limited
    sources: [cftc_cot]
    reason: Positioning from the CFTC Commitments of Traders only. No futures prices are fetched, because CME's terms could not be read. Settlement files you download yourself can be uploaded
  crypto_data:
    status: limited
    sources: [alpaca_crypto]
    reason: Alpaca's own book only, so volume is Alpaca's volume, not the whole market. Daily history from 2021. Kraken is built but blocked until its terms are confirmed
  insider_transactions:
    status: limited
    sources: [sec_edgar_form4]
    reason: Research only until a pre-registered test passes. Non-derivative Form 4 transactions only, usable from EDGAR acceptance time
  institutional_holdings:
    status: limited
    sources: [sec_edgar_13f]
    reason: Quarter-end long positions in 13(f) securities, filed up to 45 days later. Never a complete or current portfolio and no evidence of skill. CUSIPs are not mapped to tickers because no free CUSIP map exists
  large_holder_filings:
    status: limited
    sources: [sec_edgar_submissions]
    reason: Filing dates of Schedules 13D and 13G from the issuer's EDGAR filing list. The holder and stake inside each filing are not parsed yet
  congressional_disclosures:
    status: not_available
    sources: []
    reason: Not built. Periodic transaction reports reach the public up to 45 days after a trade, and many House reports are scanned documents. The source terms need checking before any automated collection
  government_procurement:
    status: not_available
    sources: []
    reason: Not built. USAspending.gov publishes federal awards. Its terms and response format need checking first. Award dates and announcement dates would be kept apart
  regulatory_actions:
    status: not_available
    sources: []
    reason: Not built beyond News. SEC and Federal Reserve press releases already arrive through News. A Federal Register integration would need its terms and format checked first
  political_sector_exposure:
    status: not_available
    sources: []
    reason: Not built. Needs recorded companies with industry codes and a pre-registered event study before any exposure is shown
  options_data_and_flow:
    status: limited
    sources: [alpaca_options_indicative]
    reason: Alpaca's free indicative feed, a modified version of exchange quotes, never executable prices. Needs your Alpaca keys. History from February 2024. Order flow data is not free
  analyst_consensus_estimates:
    status: not_available
    reason: No free source of timestamped estimates, so reported results are never compared with a consensus
  licensed_news:
    status: not_available
    reason: Lawful RSS feeds only
  non_us_execution:
    status: not_available
    reason: Market data for non-US exchanges needs monthly fees
  llm_features:
    status: limited
    sources: [local_open_weight_model]
    reason: Optional and off by default. Local models only, no paid API

  # One entry per asset class with its eight levels (core/capabilities.py LEVELS).
  # yes: built and checked. partial: part of it works. waiting: built, needs a key, a license
  # confirmation or a first live check. no: not built or not possible for free.
  asset_stocks_etfs:
    status: available
    sources: [alpaca_market_data, alpaca_paper]
    levels:
      source_exists: {state: "yes", note: "Alpaca free plan for daily bars and paper trading"}
      adapter: {state: "yes", note: "Daily bars, assets, corporate actions and quotes", modules: [candleisgreen.sources.alpaca, candleisgreen.sources.alpaca_quotes]}
      history_verified: {state: "waiting", note: "History from 2016. Response shapes follow the documentation and get their first live check when your Alpaca keys are set"}
      realtime_verified: {state: "waiting", note: "IEX quotes only on the free plan. First live check when your Alpaca keys are set"}
      research: {state: "yes", note: "Signals, backtests, composite and research pipeline", modules: [candleisgreen.composite, candleisgreen.research]}
      simulation: {state: "yes", note: "Simulated broker with the risk service", modules: [candleisgreen.broker.simulator]}
      broker_paper: {state: "yes", note: "Built and tested against a stand-in. Every order passes the independent risk service", modules: [candleisgreen.broker.alpaca_paper]}
      live_execution: {state: "no", note: "Never built"}
  asset_options:
    status: limited
    sources: [alpaca_options_indicative]
    reason: Indicative quotes only, never executable. Needs your Alpaca keys for data
    levels:
      source_exists: {state: "yes", note: "Alpaca's free indicative feed: contracts, quotes, Greeks, history from February 2024. OPRA needs a paid plan and is refused"}
      adapter: {state: "yes", note: "Read-only client for contracts, chain snapshots and bars", modules: [candleisgreen.sources.alpaca_options]}
      history_verified: {state: "waiting", note: "Needs your Alpaca keys. The check is in tests/test_live_sources.py"}
      realtime_verified: {state: "waiting", note: "Needs your Alpaca keys. Quotes are indicative and delayed trades are 15 minutes old"}
      research: {state: "partial", note: "Payoff and break-even calculator and a labeled theoretical model work now. The chain with Alpaca's Greeks needs your keys", modules: [candleisgreen.markets.options]}
      simulation: {state: "yes", note: "Fills at indicative quotes with that label, multi-leg as one package within a net limit, early assignment and expiry, cash for early assignment checked first", modules: [candleisgreen.markets.options_sim]}
      broker_paper: {state: "waiting", note: "Order builder done and nothing sends it. Sending waits for the read-only check with your keys, and indicative quotes fail the execution-grade quote rule", modules: [candleisgreen.markets.options]}
      live_execution: {state: "no", note: "Never built"}
  asset_crypto:
    status: limited
    sources: [alpaca_crypto]
    reason: Alpaca's own book only. Kraken blocked until its terms are confirmed
    levels:
      source_exists: {state: "yes", note: "Alpaca crypto data and paper trading. Kraken public data as a comparison"}
      adapter: {state: "yes", note: "Alpaca crypto client. Kraken client built and blocked by its license", modules: [candleisgreen.sources.alpaca_crypto, candleisgreen.sources.kraken]}
      history_verified: {state: "yes", note: "Daily bars for six pairs, BTC/USD from 2021-01-01", checked: "2026-11-28"}
      realtime_verified: {state: "yes", note: "Latest quotes and order books, read without keys", checked: "2026-11-28"}
      research: {state: "yes", note: "Charts, returns, volatility on calendar days, drawdown, spreads and depth", modules: [candleisgreen.markets.crypto]}
      simulation: {state: "yes", note: "Walks the live order book, refuses books older than 15 seconds, Alpaca's published fees, no shorts, no margin. The practice account is saved", modules: [candleisgreen.markets.crypto, candleisgreen.markets.crypto_ledger]}
      broker_paper: {state: "no", note: "Alpaca paper crypto orders need your keys and a read-only check of the paper account first. Not built yet"}
      live_execution: {state: "no", note: "Never built"}
  asset_forex:
    status: limited
    sources: [fred, oanda_practice]
    reason: FRED daily reference rates now. OANDA practice prices need your token and the license confirmed
    levels:
      source_exists: {state: "yes", note: "OANDA v20 practice API, history to 2005. FRED daily reference rates"}
      adapter: {state: "yes", note: "Read-only OANDA practice client with no order methods", modules: [candleisgreen.sources.oanda, candleisgreen.sources.fx]}
      history_verified: {state: "waiting", note: "Needs an OANDA practice token and the license confirmed. FRED daily rates already load"}
      realtime_verified: {state: "waiting", note: "Needs an OANDA practice token"}
      research: {state: "partial", note: "FRED daily rates and the currency part of foreign stock returns work now. Spread research needs OANDA bid and ask", modules: [candleisgreen.markets.forex, candleisgreen.sources.fx]}
      simulation: {state: "waiting", note: "Simulator built: bid and ask fills, size and leverage caps. It runs on OANDA practice prices", modules: [candleisgreen.markets.forex]}
      broker_paper: {state: "no", note: "OANDA practice orders come after the simulator is checked on OANDA data"}
      live_execution: {state: "no", note: "Never built"}
  asset_futures:
    status: limited
    sources: [cftc_cot]
    reason: Positioning only. No futures prices are fetched
    levels:
      source_exists: {state: "partial", note: "CFTC Commitments of Traders is public domain. CME settlement pages exist but their terms could not be read"}
      adapter: {state: "partial", note: "CFTC client built. Nothing reads CME", modules: [candleisgreen.sources.cftc]}
      history_verified: {state: "partial", note: "CFTC reports read for ES, NQ, CL, GC and ZN. No futures price history", checked: "2026-11-28"}
      realtime_verified: {state: "no", note: "No free real-time futures data"}
      research: {state: "partial", note: "Validated CFTC positioning by trader group. Estimated contract calendar and rolls. Continuous series on settlement files you upload with their source and a license confirmation", modules: [candleisgreen.markets.futures, candleisgreen.sources.cftc]}
      simulation: {state: "partial", note: "Daily mark to market with margin calls on uploaded settlements. Trades only contracts whose size matches the CFTC record. Calendar and tick terms are estimates until checked against CME, and you enter the margin", modules: [candleisgreen.markets.futures]}
      broker_paper: {state: "no", note: "Alpaca lists futures as coming soon. Other brokers need paid futures data"}
      live_execution: {state: "no", note: "Never built"}